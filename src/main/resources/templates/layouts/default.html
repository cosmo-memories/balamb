<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Balamb</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="container-fluid" style="padding-right: 0; padding-left: 0">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex">
        <div class="flex-grow-1 ps-0 pe-0 content-wrapper" style="padding-top: 50px;">
            <div class="d-flex flex-column text-white bg-dark p-3 main-content" style="min-height: calc(100vh - 50px);">
                <div layout:fragment="content"></div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
