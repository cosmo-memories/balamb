<div th:fragment="carouselCard (book)" xmlns:th="http://www.w3.org/1999/xhtml">

    <div class="card border-2 border-white bg-dark text-white"
         style="height: 250px; overflow: hidden;">
        <div class="row g-0 h-100">
            <div class="col-4 col-md-3 bg-light border-end border-1" style="height: 100%;">
                <img th:src="${book.image != null} ? @{~/uploads/images/{path}(path=${book.image})} : @{/images/PlaceholderCover.png}"
                     class="object-fit-cover w-100 h-100"
                     style="display: block;"
                     loading="lazy">
            </div>

            <div class="col d-flex flex-column" style="height: 100%;">
                <div class="card-body d-flex flex-column p-3">
                    <a th:href="@{/browse/{id}(id=${book.id})}">
                        <h5 class="card-title text-white text-truncate" th:text="${book.title}"
                            style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all;">

                        </h5>
                    </a>

                    <p class="card-text text-secondary mb-1 text-truncate">
                        <span th:text="${book.series}"></span>
                        &nbsp;
                    </p>

                    <p class="card-text text-secondary text-truncate">
                        by <b th:text="${book.authors[0].firstName} + ' ' + ${book.authors[0].lastName}"></b>
                    </p>

                    <p class="card-text mt-auto mb-0">
                        <b th:text="${book.category.getLabel()}" class="text-secondary"></b>
                        <b class="mx-1 text-secondary">•</b>
                        <b th:text="${book.genre.getLabel()}" class="text-secondary"></b>
                    </p>
                </div>
            </div>
        </div>
    </div>

</div>
