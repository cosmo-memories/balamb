<div th:fragment="card (book)" xmlns:th="http://www.w3.org/1999/xhtml" class="w-100">

    <div class="card h-100 w-100 border-0 border-white text-white shadow" style="--bs-card-bg: #2b3035;">
        <div class="row g-0 h-100">
            <div class="col-4 col-md-3 bg-light border border-2"
                 style="aspect-ratio: 2 / 3; overflow: hidden;">
                <img th:src="${book.image != null} ? @{~/uploads/images/{path}(path=${book.image})} : @{/images/PlaceholderCover.png}"
                     class="object-fit-cover w-100 h-100"
                     loading="lazy"
                     alt="Book Cover">
            </div>
            <div class="col d-flex flex-column" style="min-width: 0;">
                <div class="card-body d-flex flex-column">
                    <a th:href="@{/browse/{id}(id=${book.id})}">
                        <h5 class="card-title text-white" th:text="${book.title}"
                            style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        </h5>
                    </a>
                    <p th:if="${book.series != null}" class="card-text text-secondary text-truncate mb-0">
                        <span th:text="${book.series}"></span>
                    </p>
                    <p class="card-text text-secondary text-truncate mt-2">
                        by <span th:each="author, iterStat: ${book.authors}">
                                <b class="text-secondary" th:text="${author.firstName} + ' ' + ${author.lastName}"></b><span class="text-secondary" th:if="${!iterStat.last}">, </span>
                           </span>
                    </p>
                    <p class="card-text mt-auto text-truncate">
                        <b th:text="${book.category.getLabel()}" class="text-secondary"></b>
                        <b class="mx-1">•</b>
                        <b th:text="${book.genre.getLabel()}" class="text-secondary"></b>
                        <b th:if="${book.subgenre != null}" class="mx-1">•</b>
                        <b th:if="${book.subgenre != null}" th:text="${book.subgenre.getLabel()}" class="text-secondary"></b>
                    </p>
                </div>
            </div>
        </div>
    </div>

</div>
