<!DOCTYPE html>
<html xmlns:layout="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layouts/default}">
<head>
    <title>View Record</title>
    <link th:href="@{/css/admin.css}" rel="stylesheet" />
</head>
<body>

<section layout:fragment="content">
    <div class="row d-flex justify-content-between">
        <div class="col-auto">
            <h1 class="text-primary">Browse Records</h1>
        </div>
    </div>
    <hr class="mt-0">

    <div class="card mb-3 bg-dark border-0">
        <div class="row g-0">
            <div class="col-lg-2">
                <img th:src="@{~/uploads/images/{path}(path=${book.image})}"
                     onerror="this.src='/images/PlaceholderCover.png';" class="object-fit-cover w-100 h-100 border border-white border-2">
            </div>
            <div class="col-lg-10">
                <div class="card-body bg-dark" style="height: 100%">
                    <h5 class="card-title h2 text-white" th:text="${book.title}"></h5>
                    <p class="card-text text-secondary" th:if="${book.series != null}">
                        <b>Series: <span th:text="${book.series}"></span></b>
                    </p>
                    <p class="card-text text-secondary">
                        <b>
                            Author(s):
                            <span th:each="author, iterStat: ${book.authors}">
                                <b th:text="${author.firstName} + ' ' + ${author.lastName}"></b><span class="text-secondary" th:if="${iterStat.index != book.authors.size() - 1}">, </span>
                            </span>
                        </b>
                    </p>
                    <hr class="mt-0" style="width: 50%">
                    <p class="card-text text-secondary">
                        Genre(s): <span th:text="${book.genre.getLabel()}"></span><span th:if="${book.subgenre != null}" th:text="${', ' + book.subgenre.label}"></span>
                    </p>
                    <p class="card-text text-secondary">
                        Category: <span th:text="${book.category.getLabel()}"></span>
                    </p>
                    <p class="card-text text-secondary">
                        Publisher: <span th:text="${book.publisher}"></span><span th:if="${book.publisher == null}" th:text="Unknown"></span>
                    </p>
                    <p class="card-text text-secondary">
                        Publication Year: <span th:text="${book.pubYear}"></span><span th:if="${book.pubYear == null}" th:text="Unknown"></span>
                    </p>
                    <p class="card-text text-secondary">
                        ISBN: <span th:text="${book.isbn}"></span><span th:if="${book.isbn == null}" th:text="Unknown"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <hr class="mt-0">

    <div>
        <p class="card-text">
            <b>Notes:</b> <span th:text="${book.note}"></span><span th:if="${book.note == null}" th:text="None"></span>
        </p>
        <p class="card-text">
            <b>Status:</b> <span th:text="Unread" th:if="${!book.complete}"></span><span th:text="Read" th:if="${book.complete}"></span>
        </p>
    </div>

    <hr>

    <div class="container">
        <div class="row row-cols-1 row-cols-md-2">
            <div class="col my-2" th:if="${series.size() > 0}">
                <h5 class="h3 text-white text-center">More from this series:</h5>
                <div th:replace="~{fragments/carousel :: carousel(bookList = ${series}, carouselId = 'seriesCar')}"></div>
            </div>
            <div class="col my-2" th:if="${random.size() > 0}">
                <h5 class="h3 text-white text-center">More from this genre:</h5>
                <div th:replace="~{fragments/carousel :: carousel(bookList = ${random}, carouselId = 'randomCar')}"></div>
            </div>
        </div>
    </div>

    <hr>

    <div sec:authorize="isAuthenticated()" id="admin-controls">
        <div class="d-flex justify-content-center">
            <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#editPanel"
                    aria-expanded="false" aria-controls="editPanel" id="toggle" th:text="${formHasErrors != null || uploadError != null ? 'Hide' : 'Edit Book'}">
                Edit Book
            </button>
        </div>

        <div class="collapse" id="editPanel" th:classappend="${formErrors != null || uploadError != null ? ' show' : ''}">
            <hr>

            <div class="d-flex justify-content-center">
                <form method="post" th:action="@{/admin/update/{id}/complete(id=${book.id})}">
                    <button type="submit" class="btn btn-secondary py-1 my-1" th:if="${!book.complete}">Mark As Read</button>
                    <button type="submit" class="btn btn-secondary py-1 my-1" th:if="${book.complete}">Mark As Unread</button>
                </form>
            </div>

            <hr>

            <div class="d-flex flex-column justify-content-center align-items-center mx-auto" style="max-width: 500px;">
                <div class="mb-2">
                    Add or update cover:
                </div>
                <form method="post" th:action="@{/admin/add/image/{id}(id=${book.id})}" enctype="multipart/form-data">
                    <div class="input-group">
                        <input type="file" class="form-control" name="uploadedFile" id="file-upload">
                        <button class="btn btn-outline-secondary" type="submit">Upload</button>
                    </div>
                </form>
                <span th:if="${uploadError != null}" th:text="${uploadError}"></span>
            </div>

            <hr>

            <form action="#" th:action="@{/admin/edit/{id}(id=${book.id})}" th:object="${bookDto}" method="post">
                <div th:replace="~{fragments/bookForm :: bookForm}"></div>
            </form>

            <hr>

            <div class="d-flex justify-content-center">
                <a data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${book.id}" class="btn btn-secondary py-1 my-1">
                    Delete Book
                </a>
            </div>
        </div>
    </div>

    <script type="text/javascript" th:src="@{/js/admin.js}"></script>
    <script type="text/javascript" th:src="@{/js/book.js}"></script>
    <div th:replace="~{fragments/bookModals/deleteModal :: deleteModal}"></div>

</section>

</body>
</html>
