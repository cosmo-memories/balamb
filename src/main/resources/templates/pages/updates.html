<!DOCTYPE html>
<html xmlns:layout="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/default}">
<head>
    <title>Updates</title>
</head>
<body>

<section layout:fragment="content">

    <div class="container mt-3 mb-4" style="max-width: 600px">
        <form action="#" th:action="@{/updates}" method="get" id="filterForm">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <div class="flex-grow-1">
                    <select id="type" name="type" class="form-select">
                        <option value="" disabled th:selected="${type == null}">Update Type</option>
                        <option th:each="newType: ${updateType}"
                                th:text="${newType.getLabel()}"
                                th:value="${newType}"
                                th:selected="${newType == type}">
                        </option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-m">Apply Filter</button>
                    <a href="/updates" class="btn btn-secondary btn-m">Reset Filter</a>
                </div>
            </div>
        </form>
    </div>

    <hr class="mt-0">

    <p class="container d-flex justify-content-center" sec:authorize="isAuthenticated()">
        <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#updateModal">New Update</button>
    </p>

    <p th:if="${error}" th:text="${errorText}"></p>

    <p class="container d-flex justify-content-center" th:if="${updateList.empty}">
        No updates to show :(
    </p>

    <div class="container d-flex justify-content-center">
        <div class="row row-cols-1 g-4 mb-4 col-lg-11">
            <div class="col d-flex" th:each="post: ${updateList}">
                <div class="card h-100 flex-fill border-0 border-white text-bg-dark text-white shadow">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex w-100 justify-content-between">
                            <div class="d-flex">
                                <h5 class="mb-1" th:text="${post.updateType.getLabel()}"
                                th:classappend="${post.updateType.getLabel() == 'Update' || post.updateType.getLabel() == 'News'} ? text-success : ''"></h5>
                                <span th:if="${(post.updateType.getLabel() == 'To Do' || post.updateType.getLabel() == 'Known Issue') && post.resolved}" class="h5 mx-2 text-info">(Resolved)</span>
                            </div>
                            <div class="d-flex align-items-center">
                                <small class="text-white mx-3" th:text="${#temporals.format(post.created, 'dd-MM-yyyy')}"></small>
                                <div th:if="${(post.updateType.getLabel() == 'To Do' || post.updateType.getLabel() == 'Known Issue') && post.resolved == false}">
                                    <a sec:authorize="isAuthenticated()" th:onclick="'resolveUpdate(' + ${post.id} + ')'"
                                       class="btn btn-light text-black btn-sm">Resolve</a>
                                </div>

                                <div th:if="${(post.updateType.getLabel() == 'To Do' || post.updateType.getLabel() == 'Known Issue') && post.resolved == true}">
                                    <a sec:authorize="isAuthenticated()" th:onclick="'resolveUpdate(' + ${post.id} + ')'"
                                       class="btn btn-light text-black btn-sm">Unresolve</a>
                                </div>

                                <a sec:authorize="isAuthenticated()" th:if="${#authentication.principal.id == post.author.id}" data-bs-toggle="modal" th:data-bs-target="'#editModal' + ${post.id}"
                                   class="btn btn-light text-black btn-sm mx-2">Edit</a>
                                <div sec:authorize="isAuthenticated()" th:if="${#authentication.principal.id == post.author.id}" th:replace="~{fragments/updateModals/editModal :: editModal (post = ${post})}"></div>

                                <a sec:authorize="isAuthenticated()" data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${post.id}"
                                   class="btn btn-light text-black btn-sm">Delete</a>
                                <div sec:authorize="isAuthenticated()" th:replace="~{fragments/updateModals/deleteModal :: deleteModal (postId = ${post.id})}"></div>
                            </div>
                        </div>
                        <small th:text="${post.description}" th:if="${(post.updateType.getLabel() == 'To Do' || post.updateType.getLabel() == 'Known Issue') && post.resolved}" style="overflow-wrap: anywhere; text-decoration: line-through;"></small>
                        <small th:text="${post.description}" th:unless="${(post.updateType.getLabel() == 'To Do' || post.updateType.getLabel() == 'Known Issue') && post.resolved}" style="overflow-wrap: anywhere;"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="table-pagination">
        <ul class="pagination justify-content-center">
            <li th:class="${updateList.number eq 0} ? 'disabled' : ''">
                <a th:if="${not updateList.first}" th:href="'/updates?pageNo=' + ${updateList.number - 1}
                        + (${#strings.isEmpty(type)} ? '' : '&type=' + ${type})">
                    Previous
                </a>
                <a th:if="${updateList.first}">Previous</a>
            </li>
            <li class="mx-2">
                |
            </li>
            <li th:class="${updateList.number + 1 ge updateList.totalPages} ? 'disabled' : ''">
                <a th:if="${not updateList.last}" th:href="'/updates?pageNo=' + ${updateList.number + 1} + (${#strings.isEmpty(type)} ? '' : '&type=' + ${type})">
                    Next
                </a>
                <a th:if="${updateList.last}">Next</a>
            </li>
        </ul>
    </div>

    <script type="text/javascript" th:src="@{/js/update.js}"></script>
    <div th:replace="~{fragments/updateModals/updateModal :: updateModal}"></div>
</section>

</body>
</html>
