services:
  nginx-proxy:
    restart: always
    image: jwilder/nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/etc/nginx/vhost.d"
      - "/usr/share/nginx/html"
      - "/var/run/docker.sock:/tmp/docker.sock:ro"
      - "/etc/nginx/certs"
    environment:
      - VIRTUAL_PORT=8080
    networks:
      - balambnetwork

  letsencrypt-nginx-proxy-companion:
    restart: always
    image: jrcs/letsencrypt-nginx-proxy-companion
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    volumes_from:
      - "nginx-proxy"
    networks:
      - balambnetwork

  app:
    image: 'docker-spring-boot-postgres:latest'
    build:
      context: .
    container_name: app
    depends_on:
      - db
    secrets:
      - DB_PASSWORD
    environment:
      - SPRING_PROFILES_ACTIVE=container
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/balamb_db
      - SPRING_DATASOURCE_USERNAME=balamb_db
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - UPLOAD_DIR=/uploads/images
      - VIRTUAL_HOST=library.cosmo-memories.com
      - LETSENCRYPT_HOST=library.cosmo-memories.com
      - VIRTUAL_PORT=8080
#    ports:
#      - "127.0.0.1:8080:8080"
    volumes:
      - appdata:/uploads/images
    networks:
      - balambnetwork

  db:
    image: 'postgres:18.3-trixie'
    container_name: db
    secrets:
      - DB_PASSWORD
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/DB_PASSWORD
      - POSTGRES_USER=balamb_db
      - POSTGRES_DB=balamb_db
#    env_file:
#      - .env
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - balambnetwork

secrets:
  DB_PASSWORD:
    file: secrets/DB_PASSWORD.txt

volumes:
  pgdata:
  appdata:

networks:
  balambnetwork:
    driver: bridge